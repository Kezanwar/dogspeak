<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#000000" />

    <!-- meta -->
    <title>dogspeak</title>
    <meta
      name="description"
      content="peer-to-peer voice chat for the guild — bin the teamspeak."
    />

    <!-- open graph / twitter
         og:image, og:url and twitter:image must be ABSOLUTE (crawlers don't
         resolve relative URLs).
         TODO: confirm the Render origin — https://dogspeak.onrender.com is the
         default for the `dogspeak` service in render.yaml; if Render assigned
         a suffixed host (or a custom domain is added), update all three. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="dogspeak" />
    <meta
      property="og:description"
      content="peer-to-peer voice chat for the guild — bin the teamspeak."
    />
    <meta
      property="og:image"
      content="https://dogspeak.onrender.com/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://dogspeak.onrender.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="dogspeak" />
    <meta
      name="twitter:description"
      content="peer-to-peer voice chat for the guild — bin the teamspeak."
    />
    <meta
      name="twitter:image"
      content="https://dogspeak.onrender.com/og-image.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
