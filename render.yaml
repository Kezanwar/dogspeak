# Render blueprint: one Docker web service serving the app, /api and /ws on a
# single origin. Secrets marked sync: false are entered in the dashboard.
services:
  - type: web
    name: dogspeak
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ROOM_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: LOG_FORMAT
        value: json
      # "true" parks every client on the maintenance screen (see README).
      - key: MAINTENANCE
        value: "false"
      # PORT is injected by Render.
